<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: #ffa6d2;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 50px;
        }
        .main-title {
            color: white;
            text-align: center;
            font-size: 6em;
        }
        .shop-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            text-align: center;
        }

        .shop-item img {
            width: 200px;
            height: auto;
            border-radius: 8px;
        }

        .shop-item a {
            display: block;
            margin-top: 10px;
            color: #ffffff;
            text-decoration: underline;
        }

        hr {
            border: 0;
            height: 2px;
            background: white;
            margin: 40px 0;
        }

        .footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
            color: white;
        }
    </style>
</head>
<body>

    <h1 class="main-title">~ Welcome to Online Shops &amp; Co. !</h1>
    <div class="shop-container">
        <div class="shop-item">
            <img src="https://images.seeklogo.com/logo-png/38/1/shopee-logo-png_seeklogo-388616.png" alt="Shop 1">
            <br>
            <a href="https://shopee.co.th/" target="_blank">Shopee Shop</a>
        </div>
        <div class="shop-item">
            <img src="https://www.sahachol.com/en/wp-content/uploads/2025/10/lazada-logo-png_seeklogo-378741.png/200" alt="Shop 2">
            <br>
            <a href="https://www.lazada.co.th/?spm=a2o4m.10453683.header.dhome.2cd449cdAPNGsk#?" target="_blank">Lazada Shop</a>
        </div>
    </div>
    <hr>
    <div class="footer">
        &copy; tsanwong 2026
    </div>

</body>
</html>
