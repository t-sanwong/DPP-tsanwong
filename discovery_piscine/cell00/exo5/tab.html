<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
    
        table {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            margin: 50px auto;
        }
        
    
        td {
            width: 50%;
            height: 150px;
            padding: 20px;
            font-family: Arial, sans-serif;
            font-size: 18px;
            vertical-align: middle;
            border: 1px solid black;
        }

        .cell-one {
            background-color: #0a938d; 
        }

        .cell-two {
            background-color: #b9b8b8; 
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="cell-one">42 บางกอก</td>
            <td class="cell-two">42 Bangkok</td>
        </tr>
    </table>

</body>
</html>
